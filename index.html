    seasonCard.appendChild(h('p',{style:'font-size:12px;color:var(--ink-soft);margin:0 0 8px;'},'Tags any rosters, games, schedule entries, or draft pool players that predate seasons with '+currentSeasonName()+', so they show up correctly when filtering. Safe to run more than once.'));
    seasonCard.appendChild(h('button',{class:'btn btn-outline btn-block',onclick:()=>confirmModal('Migrate untagged data into '+currentSeasonName()+'?','This tags any legacy rosters, games, schedule entries, and draft pool players (that have no season yet) with this season.',migrateLegacyDataToSeason)},'Migrate Untagged Data'));
  }
  root.appendChild(seasonCard);

  const teamCard=h('div',{class:'card'}); teamCard.appendChild(h('h3',{},'Teams'));
  teamCard.appendChild(h('p',{style:'font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.5;'},'Team names and managers can change each season — edit any cell and it saves automatically. Enter a manager\u2019s email to give them manager rights: if they\u2019ve already signed up they\u2019re linked right away, otherwise they\u2019re linked the moment they sign up with that email.'));
  const sortedTeams = S.teams.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const slots = Math.max(10, sortedTeams.length + 1);
  const table=h('table',{class:'dataTable',style:'min-width:640px;'});
  table.appendChild(h('tr',{},[h('th',{},'#'),h('th',{style:'text-align:left;'},'Team'),h('th',{style:'text-align:left;'},'Manager'),h('th',{style:'text-align:left;'},'Email'),h('th',{},'Status'),h('th',{},'')]));
  const cellInp=(val,ph)=>h('input',{type:'text',value:val||'',placeholder:ph,style:'padding:6px 8px;font-size:12.5px;min-width:0;'});
  const linkManagerByEmail = async (t, email)=>{
    const em=(email||'').trim().toLowerCase();
    if(!em){ await updateDoc(doc(db,'teams',t.id),{pendingManagerEmail:null, managerUserId:null}); return; }
    const u = S.usersDirectory.find(x=>(x.email||'').toLowerCase()===em);
    if(u){
      await updateDoc(doc(db,'teams',t.id),{managerUserId:u.id, pendingManagerEmail:null});
      await updateDoc(doc(db,'users',u.id),{role:'manager', teamId:t.id, leagueId:u.leagueId||S.currentLeagueId||null});
      toast('Manager linked: '+(u.displayName||u.email));
    } else {
      await updateDoc(doc(db,'teams',t.id),{pendingManagerEmail:em, managerUserId:null});
      toast('Invited — links automatically when they sign up');
    }
  };
  for(let i=0;i<slots;i++){
    const t = sortedTeams[i];
    const row=h('tr',{});
    row.appendChild(h('td',{style:'color:var(--ink-soft);'},String(i+1)));
    if(t){
      const mgr=S.usersDirectory.find(u=>u.id===t.managerUserId);
      const nameInp=cellInp(t.name,'Team name');
      nameInp.addEventListener('change', async()=>{ const v=nameInp.value.trim(); if(!v){ nameInp.value=t.name; return; } await updateDoc(doc(db,'teams',t.id),{name:v}); toast('Team renamed'); });
      const mgrInp=cellInp(t.managerName||(mgr?(mgr.displayName||''):''),'Manager name');
      mgrInp.addEventListener('change', ()=>updateDoc(doc(db,'teams',t.id),{managerName:mgrInp.value.trim()}));
      const emailInp=cellInp(mgr?mgr.email:(t.pendingManagerEmail||''),'manager@email.com');
      emailInp.setAttribute('type','email');
      emailInp.addEventListener('change', ()=>linkManagerByEmail(t, emailInp.value));
      const active = t.active!==false;
      const statusBtn=h('button',{class: active?'pill-role':'pill-warn', style:'border:none;cursor:pointer;', onclick:async()=>{ await updateDoc(doc(db,'teams',t.id),{active:!active}); }}, active?'Active':'Open');
      const mgrState = mgr ? h('div',{style:'font-size:10px;color:var(--grass-1);margin-top:2px;'},'✓ signed in') : (t.pendingManagerEmail ? h('div',{style:'font-size:10px;color:var(--gold);margin-top:2px;'},'invited') : null);
      row.appendChild(h('td',{},nameInp));
      row.appendChild(h('td',{},mgrInp));
      row.appendChild(h('td',{},[emailInp, mgrState]));
      row.appendChild(h('td',{},statusBtn));
      row.appendChild(h('td',{},h('button',{class:'btn btn-danger btn-sm',onclick:()=>confirmModal('Remove '+t.name+'?','This deletes the team.',()=>deleteDoc(doc(db,'teams',t.id)),{danger:true})},'✕')));
    } else {
      const nameInp=cellInp('','Add a team…');
      nameInp.addEventListener('change', async()=>{ const v=nameInp.value.trim(); if(!v) return; await addDoc(collection(db,'teams'),{name:v,managerUserId:null,managerName:'',active:true,leagueId:S.currentLeagueId||null}); toast('Team added'); });
      row.appendChild(h('td',{},nameInp));
      row.appendChild(h('td',{style:'color:var(--ink-soft);'},'—'));
      row.appendChild(h('td',{style:'color:var(--ink-soft);'},'—'));
      row.appendChild(h('td',{},h('span',{class:'pill-warn'},'Open')));
      row.appendChild(h('td',{},''));
    }
    table.appendChild(row);
  }
  const tsw=h('div',{class:'gridScroll'}); tsw.appendChild(table); teamCard.appendChild(tsw);
  root.appendChild(teamCard);

  const seedCard=h('div',{class:'card'});
  seedCard.appendChild(h('h3',{},'Load Last Year Roster'));
  seedCard.appendChild(h('p',{style:'font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;'},'Creates the 10 league teams (Big Red, Bravehearts, Camo, Gold Finger, Green Machine, MisFits, Raiders, Royals, Thunder, White Wolves) with their 14-player rosters, pre-loaded from last season. Teams that already exist by name are skipped, and teams that already have players are left alone — safe to run more than once.'));
  seedCard.appendChild(h('button',{class:'btn btn-gold btn-block',onclick:()=>confirmModal('Load all 10 team rosters?','This adds 10 teams and up to 140 players to your live league database.',loadDefaultRosters)},'Load Last Year Roster'));
  root.appendChild(seedCard);

  const userCard=h('div',{class:'card'}); userCard.appendChild(h('h3',{},'Users & Roles'));
  const leagueUsers = S.usersDirectory.filter(u=>!S.currentLeagueId || u.leagueId===S.currentLeagueId || !u.leagueId);
  if(!leagueUsers.length) userCard.appendChild(h('p',{},'No registered users in this league yet.'));
  leagueUsers.forEach(u=>{
    const row=h('div',{class:'gameListRow'});
    row.appendChild(h('div',{},[h('div',{class:'glTeams'},u.email), h('div',{class:'glDate'}, u.role+(u.teamId?(' · '+((S.teams.find(t=>t.id===u.teamId)||{}).name||'')):''))]));
    const roleSel=h('select',{style:'max-width:110px;'});
    ['pending','viewer','manager','admin','declined'].forEach(r=>{ const o=h('option',{value:r},r); if(u.role===r) o.setAttribute('selected','selected'); roleSel.appendChild(o); });
    if((u.email||'').toLowerCase()===SUPER_ADMIN_EMAIL){ roleSel.disabled=true; roleSel.title='Super Admin role cannot be changed'; }
    roleSel.addEventListener('change', ()=>updateDoc(doc(db,'users',u.id),{role:roleSel.value, leagueId: u.leagueId||S.currentLeagueId||null}));
    row.appendChild(roleSel);
    userCard.appendChild(row);
    if(u.role==='manager'){
      const teamSel=h('select',{style:'margin:0 0 10px 4px;'});
      teamSel.appendChild(h('option',{value:''},'— assign team —'));
      S.teams.forEach(t=>{ const o=h('option',{value:t.id},t.name); if(u.teamId===t.id) o.setAttribute('selected','selected'); teamSel.appendChild(o); });
      teamSel.addEventListener('change', ()=>updateDoc(doc(db,'users',u.id),{teamId:teamSel.value||null}));
      userCard.appendChild(teamSel);
    }
  });
  root.appendChild(userCard);



  const importCard=h('div',{class:'card'}); importCard.appendChild(h('h3',{},'Bulk Import Rosters'));
  importCard.appendChild(h('p',{style:'font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;'},"Import a whole team's roster at once from a spreadsheet, into an existing team above. Use two columns: Team and Player (one row per player), or one column per team with player names below the header."));
  const fileInput=h('input',{type:'file',accept:'.xlsx,.xls,.csv',class:'hidden'});
  fileInput.addEventListener('change', (e)=>handleBulkRosterFile(e.target.files[0]));
  importCard.appendChild(fileInput);
  importCard.appendChild(h('button',{class:'btn btn-gold btn-block',onclick:()=>fileInput.click()},'Import Excel / CSV'));
  root.appendChild(importCard);
  makeAdminSectionsCollapsible(root);
});
function parseBulkImport(rows){
  rows=rows.filter(r=>r&&r.some(c=>c!==undefined&&c!==null&&String(c).trim()!==''));
  if(!rows.length) return null;
  let headerRowIdx=-1,teamColIdx=-1,playerColIdx=-1;
  for(let i=0;i<Math.min(5,rows.length);i++){
    const cells=rows[i].map(c=>(c===undefined||c===null)?'':String(c).trim().toLowerCase());
    const tIdx=cells.findIndex(c=>c.includes('team')); const pIdx=cells.findIndex(c=>c.includes('player')||c.includes('name'));
    if(tIdx!==-1&&pIdx!==-1){ headerRowIdx=i; teamColIdx=tIdx; playerColIdx=pIdx; break; }
  }
  const byTeam={};
  if(headerRowIdx!==-1){
    rows.slice(headerRowIdx+1).forEach(r=>{ const t=r[teamColIdx]?String(r[teamColIdx]).trim():''; const p=r[playerColIdx]?String(r[playerColIdx]).trim():''; if(!t||!p) return; (byTeam[t]=byTeam[t]||[]).push(p); });
    return byTeam;
  }
  const header=rows[0].map(c=>c?String(c).trim():'');
  header.forEach((teamName,colIdx)=>{ if(!teamName) return; const names=[]; for(let r=1;r<rows.length;r++){ const v=rows[r][colIdx]; if(v!==undefined&&v!==null&&String(v).trim()!=='') names.push(String(v).trim()); } byTeam[teamName]=names; });
  return byTeam;
}
async function migrateLegacyDataToLeague(){
  if(!S.currentLeagueId) return;
  const leagueId = S.currentLeagueId;
  let count=0;
  const teamsSnap = await getDocs(collection(db,'teams'));
  for(const d of teamsSnap.docs){ if(!d.data().leagueId){ await updateDoc(doc(db,'teams',d.id),{leagueId}); count++; } }
  const seasonsSnap = await getDocs(collection(db,'seasons'));
  for(const d of seasonsSnap.docs){ if(!d.data().leagueId){ await updateDoc(doc(db,'seasons',d.id),{leagueId}); count++; } }
  const usersSnap = await getDocs(collection(db,'users'));
  for(const d of usersSnap.docs){ if(!d.data().leagueId){ await updateDoc(doc(db,'users',d.id),{leagueId}); count++; } }
  toast('Migrated '+count+' item(s) into this league');
}
async function migrateLegacyDataToSeason(){
  if(!S.currentSeasonId) return;
  const seasonId = S.currentSeasonId;
  let count=0;
  for(const team of S.teams){
    for(const sub of ['players','games','schedule']){
      const snap = await getDocs(collection(db,'teams',team.id,sub));
      for(const d of snap.docs){
        if(!d.data().seasonId){ await updateDoc(doc(db,'teams',team.id,sub,d.id),{seasonId}); count++; }
      }
    }
  }
  const poolSnap = await getDocs(collection(db,'draftPool'));
  for(const d of poolSnap.docs){
    if(!d.data().seasonId){ await updateDoc(doc(db,'draftPool',d.id),{seasonId}); count++; }
  }
  try{
    const oldDraft = await getDoc(doc(db,'draft','state'));
    if(oldDraft.exists()){
      const newDraftSnap = await getDoc(draftStateRef());
      if(!newDraftSnap.exists()){ await setDoc(draftStateRef(), oldDraft.data()); count++; }
    }
  } catch(e){}
  toast('Migrated '+count+' item(s) into '+currentSeasonName());
}

async function loadDefaultRosters(){
  if(!S.currentSeasonId){ toast('Pick or create a season first'); return; }
  let teamsCreated=0, playersAdded=0;
  for(const teamName of Object.keys(SHSS_2026_ROSTER)){
    let team = S.teams.find(t=>t.name.toLowerCase()===teamName.toLowerCase());
    let teamId;
    if(!team){
      const ref = await addDoc(collection(db,'teams'),{name:teamName, managerUserId:null});
      teamId = ref.id; teamsCreated++;
    } else {
      teamId = team.id;
      const existingPlayers = await getDocs(collection(db,'teams',teamId,'players'));
      const seasonExisting = existingPlayers.docs.filter(d=>d.data().seasonId===S.currentSeasonId);
      if(seasonExisting.length) continue;
    }
    const names = SHSS_2026_ROSTER[teamName];
    for(let i=0;i<names.length;i++){
      await addDoc(collection(db,'teams',teamId,'players'),{ name:names[i], number:null, position:'', order:i+1, isSub:false, subTeamName:'', seasonId:S.currentSeasonId });
      playersAdded++;
    }
  }
  toast(`Loaded ${teamsCreated} new team(s), ${playersAdded} player(s)`);
}
async function handleBulkRosterFile(file){
  if(!file) return;
  if(!S.currentSeasonId){ toast('Pick or create a season first'); return; }
  try{
    let wb;
    if(file.name.toLowerCase().endsWith('.csv')){ const text=await file.text(); wb=XLSX.read(text,{type:'string'}); }
    else { const buf=await file.arrayBuffer(); wb=XLSX.read(buf,{type:'array'}); }
    const sheet=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(sheet,{header:1,blankrows:false});
    const byTeam=parseBulkImport(rows);
    if(!byTeam||!Object.keys(byTeam).length){ toast('No player data found in that file'); return; }
    const total=Object.values(byTeam).reduce((a,arr)=>a+arr.length,0);
    confirmModal('Import '+total+' players into '+currentSeasonName()+'?','This adds players to matching teams by name. Teams not found by name are skipped.', async ()=>{
      let added=0;
      for(const teamName of Object.keys(byTeam)){
        const team=S.teams.find(t=>t.name.toLowerCase()===teamName.toLowerCase());
        if(!team) continue;
        const names=byTeam[teamName];
        for(let i=0;i<names.length;i++){ await addDoc(collection(db,'teams',team.id,'players'),{name:names[i],number:null,position:'',order:i+1,isSub:false,subTeamName:'',seasonId:S.currentSeasonId}); added++; }
      }
      toast('Imported '+added+' players');
    });
  } catch(err){ console.error(err); toast('Import failed — check the file format'); }
}

renderShell();
</script>
